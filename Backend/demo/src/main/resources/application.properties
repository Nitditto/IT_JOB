spring.config.import:optional:file:../../../.env

server.forward-headers-strategy=framework

spring.application.name=demo
allowed.cors.origins=${FRONTEND_URL:http://localhost:5173}
app.cookie.secure=${COOKIE_SECURE:false}
management.endpoint.health.show-details=always

# PostgreSQL Datasource & JPA
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/it_job}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-token.expiration=604800000

app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}

# Redis cache (xem com.example.demo.redis.core) — read-through cache cho Job, khong thay the MariaDB
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Gemini (goi tu backend de khong lo key ra trinh duyet; de trong = tinh nang AI tra ve 503)
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.rate-limit.store=${RATE_LIMIT_STORE:memory}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:1000}
spring.data.redis.connect-timeout=1000
spring.data.redis.lettuce.shutdown-timeout=${REDIS_SHUTDOWN_TIMEOUT:2000ms}
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:2}
spring.data.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:1000ms}

app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# HikariCP: fail nhanh + bat leak detection de thay connection treo
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:5000}
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_THRESHOLD:15000}

# devtools restart lam backend 'chet' vai giay moi lan sua file (nhat la tren Docker bind mount Windows)
spring.devtools.restart.enabled=${DEVTOOLS_RESTART:false}

logging.level.root=INFO
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
