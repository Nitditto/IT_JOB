spring.config.import:optional:file:../../../.env

server.forward-headers-strategy=framework

spring.application.name=demo
allowed.cors.origins=${FRONTEND_URL:http://localhost:5173}
app.cookie.secure=${COOKIE_SECURE:false}
management.endpoint.health.show-details=always

jwt.secret=ZDF0IG5uZSBtYXkgdEhhbmcgR0FZLCBtYXkgY29uIGNrbyBlbmNvZGUgbmF5IGxhIGNvbiBkb2c=
jwt.expiration=900000
jwt.refresh-token.expiration=604800000

app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}

# Redis cache (xem com.example.demo.redis.core) — read-through cache cho Job, khong thay the MariaDB
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:5000}
spring.data.redis.lettuce.shutdown-timeout=${REDIS_SHUTDOWN_TIMEOUT:2000ms}
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:2}
spring.data.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:3000ms}